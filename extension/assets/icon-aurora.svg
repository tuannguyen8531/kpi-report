<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Aurora Nocturnal Glass Background -->
    <radialGradient id="aurora-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0c2b2a"/>
      <stop offset="45%" stop-color="#081827"/>
      <stop offset="100%" stop-color="#040914"/>
    </radialGradient>

    <!-- Aurora Teal to Violet Gradient -->
    <linearGradient id="aurora-teal-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Ascending Chrono Arrow / KPI Gradient -->
    <linearGradient id="aurora-chrono-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glow Core Radial -->
    <radialGradient id="aurora-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)"/>
    </radialGradient>

    <!-- Outer Rim Sheen -->
    <linearGradient id="aurora-rim-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.85)"/>
      <stop offset="50%" stop-color="rgba(192, 132, 252, 0.45)"/>
      <stop offset="100%" stop-color="rgba(45, 212, 191, 0.3)"/>
    </linearGradient>

    <!-- Soft Filter for Hologram Glow -->
    <filter id="aurora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Shield Base -->
  <rect width="512" height="512" rx="116" fill="url(#aurora-bg)"/>
  
  <!-- Subtle Inner Ambient Mesh -->
  <ellipse cx="256" cy="220" rx="200" ry="140" fill="rgba(56, 189, 248, 0.12)"/>
  <circle cx="256" cy="256" r="185" fill="rgba(168, 85, 247, 0.08)"/>

  <!-- Border Highlight Rim -->
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#aurora-rim-sheen)" stroke-width="7"/>

  <!-- 2. Outer Chrono Aperture Ring -->
  <g transform="translate(256, 256)">
    <!-- Main Quantum Outer Arc -->
    <circle cx="0" cy="0" r="172" fill="none" stroke="url(#aurora-teal-violet)" stroke-width="12" stroke-linecap="round" stroke-dasharray="210 32 90 28 320 30" filter="url(#aurora-glow)"/>

    <!-- Subtle Radar Orbit Ring -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="6 8"/>

    <!-- Precision Chrono Ticks (12 Hours) -->
    <line x1="0" y1="-172" x2="0" y2="-152" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="0" x2="152" y2="0" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="172" x2="0" y2="154" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>
    <line x1="-172" y1="0" x2="-152" y2="0" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"/>

    <!-- Minor Ticks -->
    <line x1="86" y1="-149" x2="76" y2="-132" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="149" y1="-86" x2="132" y2="-76" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="149" y1="86" x2="132" y2="76" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="86" y1="149" x2="76" y2="132" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-86" y1="149" x2="-76" y2="132" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-149" y1="86" x2="-132" y2="76" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-149" y1="-86" x2="-132" y2="-76" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-86" y1="-149" x2="-76" y2="-132" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Dynamic KPI Pulse Wave -->
    <path d="M -136 40 L -70 40 L -40 -20 L -10 60 L 25 -45 L 55 40 L 136 40" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Central Kinetic Chrono Arrow -->
    <path d="M 0 -115 L -64 78 L -18 58 L 0 -115 Z" fill="url(#aurora-chrono-grad)" fill-opacity="0.95"/>
    <path d="M 0 -115 L 64 78 L 18 58 L 0 -115 Z" fill="url(#aurora-chrono-grad)"/>

    <!-- Inner Core Cutout -->
    <path d="M 0 -70 L -22 56 L 0 42 L 22 56 Z" fill="#081827"/>

    <!-- Secondary Indicator Hand -->
    <path d="M 0 0 L -68 -68" stroke="#c084fc" stroke-width="8" stroke-linecap="round" filter="url(#aurora-glow)"/>

    <!-- 4. Core Center -->
    <circle cx="0" cy="0" r="46" fill="url(#aurora-core-glow)" opacity="0.8"/>
    <circle cx="0" cy="0" r="24" fill="#06121f" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>

    <!-- 5. Apex KPI Diamond Star -->
    <g transform="translate(0, -118)">
      <circle cx="0" cy="0" r="7" fill="#ffffff" filter="url(#aurora-glow)"/>
      <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    </g>
  </g>
</svg>
