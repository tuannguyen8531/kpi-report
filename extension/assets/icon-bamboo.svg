<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Zen Bamboo Jade Radiant Glass Background -->
    <radialGradient id="bamboo-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="45%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>

    <!-- Emerald Jade Bamboo Gradient -->
    <linearGradient id="bamboo-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ascending Chrono Arrow / KPI Gradient -->
    <linearGradient id="bamboo-chrono-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glow Core Radial -->
    <radialGradient id="bamboo-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)"/>
    </radialGradient>

    <!-- Outer Rim Sheen -->
    <linearGradient id="bamboo-rim-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)"/>
      <stop offset="50%" stop-color="rgba(52, 211, 153, 0.6)"/>
      <stop offset="100%" stop-color="rgba(5, 150, 105, 0.4)"/>
    </linearGradient>

    <!-- Soft Filter for Hologram Glow -->
    <filter id="bamboo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Shield Base -->
  <rect width="512" height="512" rx="116" fill="url(#bamboo-bg)"/>
  
  <!-- Subtle Inner Ambient Mesh -->
  <ellipse cx="256" cy="220" rx="200" ry="140" fill="rgba(255, 255, 255, 0.65)"/>
  <circle cx="256" cy="256" r="185" fill="rgba(16, 185, 129, 0.15)"/>

  <!-- Border Highlight Rim -->
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#bamboo-rim-sheen)" stroke-width="7"/>

  <!-- 2. Outer Chrono Aperture Ring -->
  <g transform="translate(256, 256)">
    <!-- Main Quantum Outer Arc -->
    <circle cx="0" cy="0" r="172" fill="none" stroke="url(#bamboo-emerald-grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="210 32 90 28 320 30" filter="url(#bamboo-glow)"/>

    <!-- Subtle Radar Orbit Ring -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="#059669" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="6 8"/>

    <!-- Precision Chrono Ticks (12 Hours) -->
    <line x1="0" y1="-172" x2="0" y2="-152" stroke="#064e3b" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="0" x2="152" y2="0" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="172" x2="0" y2="154" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <line x1="-172" y1="0" x2="-152" y2="0" stroke="#059669" stroke-width="5" stroke-linecap="round"/>

    <!-- Minor Ticks -->
    <line x1="86" y1="-149" x2="76" y2="-132" stroke="rgba(5,150,105,0.5)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="149" y1="-86" x2="132" y2="-76" stroke="rgba(5,150,105,0.5)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="149" y1="86" x2="132" y2="76" stroke="rgba(5,150,105,0.5)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="86" y1="149" x2="76" y2="132" stroke="rgba(5,150,105,0.5)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-86" y1="149" x2="-76" y2="132" stroke="rgba(5,150,105,0.5)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-149" y1="86" x2="-132" y2="76" stroke="rgba(5,150,105,0.5)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-149" y1="-86" x2="-132" y2="-76" stroke="rgba(5,150,105,0.5)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-86" y1="-149" x2="-76" y2="-132" stroke="rgba(5,150,105,0.5)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Dynamic KPI Pulse Wave -->
    <path d="M -136 40 L -70 40 L -40 -20 L -10 60 L 25 -45 L 55 40 L 136 40" fill="none" stroke="rgba(5, 150, 105, 0.55)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Central Kinetic Chrono Arrow -->
    <path d="M 0 -115 L -64 78 L -18 58 L 0 -115 Z" fill="url(#bamboo-chrono-grad)" fill-opacity="0.95"/>
    <path d="M 0 -115 L 64 78 L 18 58 L 0 -115 Z" fill="url(#bamboo-chrono-grad)"/>

    <!-- Inner Core Cutout -->
    <path d="M 0 -70 L -22 56 L 0 42 L 22 56 Z" fill="#ecfdf5"/>

    <!-- Secondary Indicator Hand -->
    <path d="M 0 0 L -68 -68" stroke="#34d399" stroke-width="8" stroke-linecap="round" filter="url(#bamboo-glow)"/>

    <!-- 4. Core Center -->
    <circle cx="0" cy="0" r="46" fill="url(#bamboo-core-glow)" opacity="0.85"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#059669" stroke-width="5"/>
    <circle cx="0" cy="0" r="10" fill="#047857"/>

    <!-- 5. Apex KPI Diamond Star -->
    <g transform="translate(0, -118)">
      <circle cx="0" cy="0" r="7" fill="#ffffff" filter="url(#bamboo-glow)"/>
      <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="#059669"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
