<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Sakura Blossom Delicate Pastel Glass Background -->
    <radialGradient id="sakura-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8f9"/>
      <stop offset="45%" stop-color="#fdf2f4"/>
      <stop offset="100%" stop-color="#f9d8e0"/>
    </radialGradient>

    <!-- Soft Rose Pastel Gradient -->
    <linearGradient id="sakura-rose-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3a6b8"/>
      <stop offset="50%" stop-color="#e8859c"/>
      <stop offset="100%" stop-color="#d8647f"/>
    </linearGradient>

    <!-- Ascending Chrono Arrow / KPI Gradient -->
    <linearGradient id="sakura-chrono-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c45874"/>
      <stop offset="60%" stop-color="#f29bb0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glow Core Radial -->
    <radialGradient id="sakura-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fce7ed"/>
      <stop offset="85%" stop-color="#e8859c"/>
      <stop offset="100%" stop-color="rgba(232, 133, 156, 0)"/>
    </radialGradient>

    <!-- Outer Rim Sheen -->
    <linearGradient id="sakura-rim-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)"/>
      <stop offset="50%" stop-color="rgba(243, 166, 184, 0.5)"/>
      <stop offset="100%" stop-color="rgba(216, 100, 127, 0.3)"/>
    </linearGradient>

    <!-- Soft Filter for Hologram Glow -->
    <filter id="sakura-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Shield Base -->
  <rect width="512" height="512" rx="116" fill="url(#sakura-bg)"/>
  
  <!-- Subtle Inner Ambient Mesh -->
  <ellipse cx="256" cy="220" rx="200" ry="140" fill="rgba(255, 255, 255, 0.75)"/>
  <circle cx="256" cy="256" r="185" fill="rgba(243, 166, 184, 0.12)"/>

  <!-- Border Highlight Rim -->
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#sakura-rim-sheen)" stroke-width="6"/>

  <!-- 2. Outer Chrono Aperture Ring -->
  <g transform="translate(256, 256)">
    <!-- Main Quantum Outer Arc -->
    <circle cx="0" cy="0" r="172" fill="none" stroke="url(#sakura-rose-fuchsia)" stroke-width="11" stroke-linecap="round" stroke-dasharray="210 32 90 28 320 30" filter="url(#sakura-glow)"/>

    <!-- Subtle Radar Orbit Ring -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="#e8859c" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="6 8"/>

    <!-- Precision Chrono Ticks (12 Hours) -->
    <line x1="0" y1="-172" x2="0" y2="-152" stroke="#b34863" stroke-width="5" stroke-linecap="round"/>
    <line x1="172" y1="0" x2="152" y2="0" stroke="#d8647f" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="172" x2="0" y2="154" stroke="#e8859c" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-172" y1="0" x2="-152" y2="0" stroke="#d8647f" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Minor Ticks -->
    <line x1="86" y1="-149" x2="76" y2="-132" stroke="rgba(216,100,127,0.4)" stroke-width="3" stroke-linecap="round"/>
    <line x1="149" y1="-86" x2="132" y2="-76" stroke="rgba(216,100,127,0.4)" stroke-width="3" stroke-linecap="round"/>
    <line x1="149" y1="86" x2="132" y2="76" stroke="rgba(216,100,127,0.4)" stroke-width="3" stroke-linecap="round"/>
    <line x1="86" y1="149" x2="76" y2="132" stroke="rgba(216,100,127,0.4)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-86" y1="149" x2="-76" y2="132" stroke="rgba(216,100,127,0.4)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-149" y1="86" x2="-132" y2="76" stroke="rgba(216,100,127,0.4)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-149" y1="-86" x2="-132" y2="-76" stroke="rgba(216,100,127,0.4)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-86" y1="-149" x2="-76" y2="-132" stroke="rgba(216,100,127,0.4)" stroke-width="3" stroke-linecap="round"/>

    <!-- Dynamic KPI Pulse Wave -->
    <path d="M -136 40 L -70 40 L -40 -20 L -10 60 L 25 -45 L 55 40 L 136 40" fill="none" stroke="rgba(216, 100, 127, 0.45)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Central Kinetic Chrono Arrow -->
    <path d="M 0 -115 L -64 78 L -18 58 L 0 -115 Z" fill="url(#sakura-chrono-grad)" fill-opacity="0.95"/>
    <path d="M 0 -115 L 64 78 L 18 58 L 0 -115 Z" fill="url(#sakura-chrono-grad)"/>

    <!-- Inner Core Cutout -->
    <path d="M 0 -70 L -22 56 L 0 42 L 22 56 Z" fill="#fff5f7"/>

    <!-- Secondary Indicator Hand -->
    <path d="M 0 0 L -68 -68" stroke="#f29bb0" stroke-width="7" stroke-linecap="round" filter="url(#sakura-glow)"/>

    <!-- 4. Core Center -->
    <circle cx="0" cy="0" r="46" fill="url(#sakura-core-glow)" opacity="0.8"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#d8647f" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="#b34863"/>

    <!-- 5. Apex KPI Diamond Star -->
    <g transform="translate(0, -118)">
      <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#sakura-glow)"/>
      <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="#d8647f"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
