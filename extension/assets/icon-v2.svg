<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Space Obsidian Glass Background -->
    <radialGradient id="v2-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a223f"/>
      <stop offset="45%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#04060e"/>
    </radialGradient>

    <!-- Neon Cyan to Violet Cyber Gradient -->
    <linearGradient id="v2-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Ascending Chrono Arrow / KPI Gradient -->
    <linearGradient id="v2-chrono-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glow Core Radial -->
    <radialGradient id="v2-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="85%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)"/>
    </radialGradient>

    <!-- Outer Rim Sheen -->
    <linearGradient id="v2-rim-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.8)"/>
      <stop offset="50%" stop-color="rgba(192, 132, 252, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0.15)"/>
    </linearGradient>

    <!-- Soft Filter for Hologram Glow -->
    <filter id="v2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Shield Base -->
  <rect width="512" height="512" rx="116" fill="url(#v2-bg)"/>
  
  <!-- Subtle Inner Ambient Mesh -->
  <ellipse cx="256" cy="220" rx="200" ry="140" fill="rgba(0, 240, 255, 0.08)"/>
  <circle cx="256" cy="256" r="185" fill="rgba(99, 102, 241, 0.06)"/>

  <!-- Border Highlight Rim -->
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#v2-rim-sheen)" stroke-width="7"/>

  <!-- 2. Outer Chrono Aperture Ring (Segments with Laser Gaps) -->
  <g transform="translate(256, 256)">
    <!-- Main Quantum Outer Arc -->
    <circle cx="0" cy="0" r="172" fill="none" stroke="url(#v2-cyan-violet)" stroke-width="12" stroke-linecap="round" stroke-dasharray="210 32 90 28 320 30" filter="url(#v2-glow)"/>

    <!-- Subtle Radar Orbit Ring -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="6 8"/>

    <!-- Precision Chrono Ticks (12 Hours) -->
    <!-- Major Cardinal Ticks (12, 3, 6, 9) -->
    <line x1="0" y1="-172" x2="0" y2="-152" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="0" x2="152" y2="0" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="172" x2="0" y2="154" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
    <line x1="-172" y1="0" x2="-152" y2="0" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>

    <!-- Minor Ticks (1, 2, 4, 5, 7, 8, 10, 11) -->
    <line x1="86" y1="-149" x2="76" y2="-132" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="149" y1="-86" x2="132" y2="-76" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="149" y1="86" x2="132" y2="76" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="86" y1="149" x2="76" y2="132" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-86" y1="149" x2="-76" y2="132" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-149" y1="86" x2="-132" y2="76" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-149" y1="-86" x2="-132" y2="-76" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-86" y1="-149" x2="-76" y2="-132" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Dynamic KPI Pulse Wave (Electrocardiogram of Productivity) -->
    <path d="M -136 40 L -70 40 L -40 -20 L -10 60 L 25 -45 L 55 40 L 136 40" fill="none" stroke="rgba(0, 240, 255, 0.45)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Central Quantum Vector: Ascending Kinetic Chrono Arrow -->
    <!-- Forward Vector Wing (Left) -->
    <path d="M 0 -115 L -64 78 L -18 58 L 0 -115 Z" fill="url(#v2-chrono-grad)" fill-opacity="0.95"/>
    
    <!-- Forward Vector Wing (Right - Luminous Highlight) -->
    <path d="M 0 -115 L 64 78 L 18 58 L 0 -115 Z" fill="url(#v2-chrono-grad)"/>

    <!-- Inner Core Cutout for Aerospace Stealth Delta Profile -->
    <path d="M 0 -70 L -22 56 L 0 42 L 22 56 Z" fill="#0d1326"/>

    <!-- Secondary Chrono Indicator Hand (Pointing towards 10 o'clock) -->
    <path d="M 0 0 L -68 -68" stroke="#c084fc" stroke-width="8" stroke-linecap="round" filter="url(#v2-glow)"/>

    <!-- 4. Quantum Fusion Core Center -->
    <!-- Large Radiant Bloom -->
    <circle cx="0" cy="0" r="46" fill="url(#v2-core-glow)" opacity="0.8"/>
    
    <!-- Heavy Titanium Hub -->
    <circle cx="0" cy="0" r="24" fill="#090d1c" stroke="#00f0ff" stroke-width="5"/>
    
    <!-- Pure White Fusion Point -->
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>

    <!-- 5. Apex KPI Diamond Star (Peak Goal Reached) -->
    <!-- Diamond Sparkle at the Arrow Tip (0, -115) -->
    <g transform="translate(0, -118)">
      <circle cx="0" cy="0" r="7" fill="#ffffff" filter="url(#v2-glow)"/>
      <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3" fill="#00f0ff"/>
    </g>
  </g>
</svg>