[project]
name = "kpi-report"
version = "0.1.0"
description = "KPI Report Generator for GitLab data"
readme = "README.md"
authors = [
    { name = "SeventhS", email = "tuannguyen8531@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "requests", 
    "python-dotenv",
    "tqdm",
    "openpyxl",
]

[project.scripts]
report = "kpi_report:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"
